<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onze</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><clipPath id="logo-clip"><rect x="0" y="0" width="64" height="40"/></clipPath></defs>
      <circle cx="32" cy="40" r="15" fill="currentColor" clip-path="url(#logo-clip)"/>
      <path d="M8 40h48M16 48h32M24 56h16" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="now">
      <p class="eyebrow">Musique et radio</p>
      <p id="now" class="title" role="status">Rien en cours de lecture</p>
    </div>
    <div id="bars" class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </header>

  <div id="tracks" class="mp"></div>

  <label class="volume">Volume
    <input type="range" id="level" min="0" max="1" step="0.01">
  </label>

  <button type="button" id="stop" class="stop" disabled>Arrêter la lecture</button>
  <p class="hint">La lecture continue quand vous fermez cette fenêtre ou l'onglet Onze.</p>

  <p class="about">Onze, créé par <a href="https://www.akramtouabet.com" target="_blank" rel="noopener">Akram TOUABET</a></p>

  <script type="module" src="js/popup.js"></script>
</body>
</html>
